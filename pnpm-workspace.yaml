# pnpm 12 otherwise prepends an environment document to pnpm-lock.yaml that
# GitHub's dependency graph currently reads as an empty project graph.
pmOnFail: ignore

# Migrated from package.json "pnpm.overrides" (pnpm 11+ reads overrides here).
overrides:
  picomatch: ">=4.0.7"
  postcss: ">=8.5.29"
  vite: ">=8.3.4"
